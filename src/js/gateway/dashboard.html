<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JPClaw Benchmark Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      padding: 20px;
      line-height: 1.6;
    }

    .container { max-width: 1400px; margin: 0 auto; }

    header {
      text-align: center;
      padding: 30px 0;
      border-bottom: 2px solid #333;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: #888;
      font-size: 0.9em;
    }

    .actions {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1em;
      transition: all 0.3s;
    }

    button:hover { background: #5568d3; transform: translateY(-2px); }
    button:active { transform: translateY(0); }
    button:disabled { background: #444; cursor: not-allowed; }

    .core-metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .metric-card {
      background: #1a1a1a;
      padding: 25px;
      border-radius: 12px;
      border: 1px solid #333;
      text-align: center;
      transition: all 0.3s;
    }

    .metric-card:hover {
      border-color: #667eea;
      transform: translateY(-4px);
      box-shadow: 0 8px 16px rgba(102, 126, 234, 0.2);
    }

    .metric-title {
      font-size: 0.9em;
      color: #888;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .metric-value {
      font-size: 3em;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .metric-grade {
      font-size: 1.2em;
      color: #667eea;
      font-weight: bold;
    }

    .grade-A { color: #10b981; }
    .grade-B { color: #3b82f6; }
    .grade-C { color: #f59e0b; }
    .grade-D { color: #ef4444; }

    .detail-section {
      background: #1a1a1a;
      padding: 25px;
      border-radius: 12px;
      border: 1px solid #333;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 1.5em;
      margin-bottom: 15px;
      color: #fff;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }

    .progress-bar {
      height: 30px;
      background: #2a2a2a;
      border-radius: 15px;
      overflow: hidden;
      margin-bottom: 15px;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      transition: width 0.5s ease;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 15px;
      color: white;
      font-weight: bold;
    }

    .metric-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #2a2a2a;
    }

    .metric-label { color: #aaa; }
    .metric-data { font-weight: bold; color: #fff; }

    .loading {
      text-align: center;
      padding: 50px;
      font-size: 1.2em;
      color: #888;
    }

    .error {
      background: #2a1a1a;
      border: 1px solid #ef4444;
      padding: 20px;
      border-radius: 8px;
      color: #ef4444;
      margin-bottom: 20px;
    }

    .overall-grade {
      text-align: center;
      margin-bottom: 25px;
      padding: 18px;
      background: #1a1a1a;
      border-radius: 12px;
      border: 1px solid #333;
    }

    .overall-grade .label {
      font-size: 1.1em;
      color: #888;
      margin-right: 10px;
    }

    .overall-grade .grade {
      font-size: 2.4em;
      font-weight: bold;
    }

    .ref-value {
      font-size: 0.8em;
      color: #555;
      margin-left: 8px;
    }

    .ref-value::before {
      content: "| ";
      color: #333;
    }

    .timestamp {
      text-align: center;
      color: #666;
      margin-top: 20px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>JPClaw Benchmark Dashboard</h1>
      <p class="subtitle">四维评估：正确性 · 性能 · 泛化能力 · AI Native</p>
    </header>

    <div class="actions">
      <button onclick="loadReport()">🔄 刷新数据</button>
      <button onclick="runBenchmark()" id="runBtn">▶️ 运行 Benchmark</button>
    </div>

    <div id="content">
      <div class="loading">正在加载数据...</div>
    </div>
  </div>

  <script>
    let report = null;

    async function loadReport() {
      try {
        const response = await fetch('/benchmark/report');
        if (!response.ok) {
          throw new Error('No report found');
        }
        report = await response.json();
        renderDashboard();
      } catch (error) {
        document.getElementById('content').innerHTML = `
          <div class="error">
            ❌ 无法加载 Benchmark 报告<br>
            ${error.message}<br><br>
            <small>请先运行 Benchmark 测试生成报告</small>
          </div>
        `;
      }
    }

    async function runBenchmark() {
      const btn = document.getElementById('runBtn');
      btn.disabled = true;
      btn.textContent = '⏳ 正在运行...';

      document.getElementById('content').innerHTML = '<div class="loading">Benchmark 测试进行中...<br>预计耗时: 2-3 分钟</div>';

      try {
        const response = await fetch('/benchmark', { method: 'POST' });
        if (!response.ok) {
          throw new Error('Benchmark failed');
        }
        report = await response.json();
        renderDashboard();
      } catch (error) {
        document.getElementById('content').innerHTML = `
          <div class="error">❌ Benchmark 执行失败<br>${error.message}</div>
        `;
      } finally {
        btn.disabled = false;
        btn.textContent = '▶️ 运行 Benchmark';
      }
    }

    function renderDashboard() {
      const { metrics, grade, correctness, performance, generalization, aiNative, timestamp } = report;

      document.getElementById('content').innerHTML = `
        <!-- 总评 -->
        <div class="overall-grade">
          <span class="label">总评</span>
          <span class="grade grade-${grade.overall}">${grade.overall} 级</span>
        </div>

        <!-- 核心指标 -->
        <div class="core-metrics">
          <div class="metric-card">
            <div class="metric-title">正确性 Correctness</div>
            <div class="metric-value">${(metrics.correctness.overall * 100).toFixed(1)}%</div>
            <div class="metric-grade grade-${grade.correctness}">${grade.correctness} 级</div>
          </div>

          <div class="metric-card">
            <div class="metric-title">性能 Performance</div>
            <div class="metric-value">${metrics.performance.latency.avg.toFixed(0)}ms</div>
            <div class="metric-grade grade-${grade.performance}">${grade.performance} 级</div>
          </div>

          <div class="metric-card">
            <div class="metric-title">泛化能力 Generalization</div>
            <div class="metric-value">${(generalization.overall * 100).toFixed(1)}%</div>
            <div class="metric-grade grade-${grade.generalization}">${grade.generalization} 级</div>
          </div>

          <div class="metric-card">
            <div class="metric-title">AI Native 能力</div>
            <div class="metric-value">${(metrics.aiNative.aiDriven * 100).toFixed(1)}%</div>
            <div class="metric-grade grade-${grade.aiNative}">${grade.aiNative} 级</div>
          </div>
        </div>

        <!-- 正确性详情 -->
        <div class="detail-section">
          <div class="section-title">1️⃣ 正确性详情</div>
          <div class="metric-row">
            <span class="metric-label">总体准确率</span>
            <span class="metric-data">${(metrics.correctness.overall * 100).toFixed(1)}%<span class="ref-value">世界级 ≥95%</span></span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" style="width: ${metrics.correctness.overall * 100}%">
              ${(metrics.correctness.overall * 100).toFixed(1)}%
            </div>
          </div>

          <div class="metric-row">
            <span class="metric-label">精确率 (Precision)</span>
            <span class="metric-data">${(metrics.correctness.precision * 100).toFixed(1)}%<span class="ref-value">世界级 ≥97%</span></span>
          </div>
          <div class="metric-row">
            <span class="metric-label">召回率 (Recall)</span>
            <span class="metric-data">${(metrics.correctness.recall * 100).toFixed(1)}%<span class="ref-value">世界级 ≥95%</span></span>
          </div>
          <div class="metric-row">
            <span class="metric-label">F1 分数</span>
            <span class="metric-data">${(metrics.correctness.f1Score * 100).toFixed(1)}%<span class="ref-value">世界级 ≥96%</span></span>
          </div>
          <div class="metric-row">
            <span class="metric-label">测试用例</span>
            <span class="metric-data">${correctness.passedCases}/${correctness.totalCases} 通过</span>
          </div>
        </div>

        <!-- 性能详情 -->
        <div class="detail-section">
          <div class="section-title">2️⃣ 性能详情</div>
          <div class="metric-row">
            <span class="metric-label">平均响应时间</span>
            <span class="metric-data">${metrics.performance.latency.avg.toFixed(0)}ms<span class="ref-value">世界级 ≤500ms</span></span>
          </div>
          <div class="metric-row">
            <span class="metric-label">P50 延迟</span>
            <span class="metric-data">${metrics.performance.latency.p50.toFixed(0)}ms<span class="ref-value">世界级 ≤300ms</span></span>
          </div>
          <div class="metric-row">
            <span class="metric-label">P95 延迟</span>
            <span class="metric-data">${metrics.performance.latency.p95.toFixed(0)}ms<span class="ref-value">世界级 ≤1000ms</span></span>
          </div>
          <div class="metric-row">
            <span class="metric-label">P99 延迟</span>
            <span class="metric-data">${metrics.performance.latency.p99.toFixed(0)}ms<span class="ref-value">世界级 ≤2000ms</span></span>
          </div>
          <div class="metric-row">
            <span class="metric-label">吞吐量</span>
            <span class="metric-data">${metrics.performance.throughput.toFixed(1)} req/min<span class="ref-value">世界级 ≥100</span></span>
          </div>
          <div class="metric-row">
            <span class="metric-label">Token 消耗</span>
            <span class="metric-data">${metrics.performance.efficiency.totalTokens.toFixed(0)}/请求<span class="ref-value">世界级 ≤500</span></span>
          </div>
          <div class="metric-row">
            <span class="metric-label">LLM 调用</span>
            <span class="metric-data">${metrics.performance.efficiency.llmCalls.toFixed(1)}次/请求<span class="ref-value">世界级 ≤1.0</span></span>
          </div>
        </div>

        <!-- 泛化能力详情 -->
        <div class="detail-section">
          <div class="section-title">3️⃣ 泛化能力详情</div>
          <div class="metric-row">
            <span class="metric-label">零样本成功率</span>
            <span class="metric-data">${(metrics.generalization.zeroShot * 100).toFixed(1)}%<span class="ref-value">世界级 ≥90%</span></span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" style="width: ${metrics.generalization.zeroShot * 100}%">
              ${(metrics.generalization.zeroShot * 100).toFixed(1)}%
            </div>
          </div>

          <div class="metric-row">
            <span class="metric-label">语义理解能力</span>
            <span class="metric-data">${(metrics.generalization.semanticVariation * 100).toFixed(1)}%<span class="ref-value">世界级 ≥95%</span></span>
          </div>
          <div class="metric-row">
            <span class="metric-label">拼写容忍度</span>
            <span class="metric-data">${(metrics.generalization.typoTolerance * 100).toFixed(1)}%<span class="ref-value">世界级 ≥90%</span></span>
          </div>
          <div class="metric-row">
            <span class="metric-label">噪声抗性</span>
            <span class="metric-data">${(metrics.generalization.noiseResistance * 100).toFixed(1)}%<span class="ref-value">世界级 ≥95%</span></span>
          </div>
          <div class="metric-row">
            <span class="metric-label">仅靠描述路由</span>
            <span class="metric-data">${(metrics.generalization.descriptionOnly * 100).toFixed(1)}%<span class="ref-value">世界级 ≥85%</span></span>
          </div>
        </div>

        <!-- AI Native 详情 -->
        <div class="detail-section">
          <div class="section-title">4️⃣ AI Native 能力</div>
          <div class="metric-row">
            <span class="metric-label">AI 决策占比</span>
            <span class="metric-data">${(metrics.aiNative.aiDriven * 100).toFixed(1)}%<span class="ref-value">世界级 ≥95%</span></span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" style="width: ${metrics.aiNative.aiDriven * 100}%">
              ${(metrics.aiNative.aiDriven * 100).toFixed(1)}%
            </div>
          </div>

          <div class="metric-row">
            <span class="metric-label">硬编码规则占比</span>
            <span class="metric-data">${(metrics.aiNative.hardcoded * 100).toFixed(1)}%<span class="ref-value">世界级 ≤5%</span></span>
          </div>
          <div class="metric-row">
            <span class="metric-label">置信度校准度</span>
            <span class="metric-data">${(metrics.aiNative.confidenceCalibration * 100).toFixed(1)}%<span class="ref-value">世界级 ≥90%</span></span>
          </div>
          <div class="metric-row">
            <span class="metric-label">降级决策正确率</span>
            <span class="metric-data">${(metrics.aiNative.degradationWisdom * 100).toFixed(1)}%<span class="ref-value">世界级 ≥90%</span></span>
          </div>
          <div class="metric-row">
            <span class="metric-label">Stage B 准确率</span>
            <span class="metric-data">${(metrics.aiNative.stageBAccuracy * 100).toFixed(1)}%<span class="ref-value">世界级 ≥95%</span></span>
          </div>
        </div>

        <div class="timestamp">
          最后更新: ${new Date(timestamp).toLocaleString('zh-CN')}
        </div>
      `;
    }

    // 页面加载时自动加载报告
    loadReport();
  </script>
</body>
</html>
